# Web 工具目录种子（10 条，Task 4 hand-authored，源自 RedTeam-Tools Web 子集）
# 字段 = models.ToolEntry；URL 为官方仓库
# permission_tier 分级：recon < scan < exploit < destructive（INTEGRATION 档位映射）
- name: httpx
  url: https://github.com/projectdiscovery/httpx
  phase: recon
  category: http-probe
  permission_tier: recon
  wrap_as: capability
- name: subfinder
  url: https://github.com/projectdiscovery/subfinder
  phase: recon
  category: subdomain-enum
  permission_tier: recon
  wrap_as: capability
- name: gowitness
  url: https://github.com/sensepost/gowitness
  phase: recon
  category: screenshot
  permission_tier: recon
  wrap_as: capability
- name: dismap
  url: https://github.com/zhzyker/dismap
  phase: recon
  category: fingerprint
  permission_tier: recon
  wrap_as: capability
- name: nuclei
  url: https://github.com/projectdiscovery/nuclei
  phase: scan
  category: vuln-scanner
  permission_tier: scan
  wrap_as: capability
- name: gobuster
  url: https://github.com/OJ/gobuster
  phase: scan
  category: content-discovery
  permission_tier: scan
  wrap_as: capability
- name: feroxbuster
  url: https://github.com/epi052/feroxbuster
  phase: scan
  category: content-discovery
  permission_tier: scan
  wrap_as: capability
- name: nmap
  url: https://github.com/nmap/nmap
  phase: scan
  category: port-scan
  permission_tier: scan
  wrap_as: mcp
- name: mitmproxy
  url: https://github.com/mitmproxy/mitmproxy
  phase: scan
  category: traffic-proxy
  permission_tier: scan
  wrap_as: cli
- name: sqlmap
  url: https://github.com/sqlmapproject/sqlmap
  phase: exploit
  category: injection
  permission_tier: exploit
  wrap_as: capability
